        return `<div class="keyword-wrap">${list.map(k => `<span class="keyword-pill">${k}</span>`).join('')}</div>`;
    }

        return `<ul class="action-list">${list.map(a => `<li>${a}</li>`).join('')}</ul>`;
    }

    let historyLines = []; 
    let isSpinning = false;
    let currentTabMode = 'coin';

    function switchTab(mode) {
        if(isSpinning) return;
        currentTabMode = mode;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('coinPanel').classList.remove('active');
        document.getElementById('numberPanel').classList.remove('active');
        document.getElementById('resultSection').style.display = 'none';

        if(mode === 'coin') {
            event.currentTarget.classList.add('active');
            document.getElementById('coinPanel').classList.add('active');
            historyLines = [];
            document.getElementById("coinBtn").innerText = "🪙 동전 던지기 (0/6)";
            document.getElementById("coinBtn").disabled = false;
        } else {
            event.currentTarget.classList.add('active');
            document.getElementById('numberPanel').classList.add('active');
        }
    }

    function throwCoinsComponent() {
        if (isSpinning || historyLines.length >= 6) return;
        isSpinning = true;
        const btn = document.getElementById("coinBtn");
        btn.disabled = true;

        for(let i=0; i<3; i++) document.getElementById(`c${i}`).classList.add("spinning");

        setTimeout(() => {
            let score = 0;
            for(let i=0; i<3; i++) {
                const isYang = Math.random() > 0.5;
                score += isYang ? 3 : 2;
                const coinEl = document.getElementById(`c${i}`);
                coinEl.classList.remove("spinning");
                coinEl.innerText = isYang ? "陽" : "陰";
                coinEl.style.background = isYang ? "linear-gradient(135deg, #eed48f, #b8892f)" : "linear-gradient(135deg, #7c768a, #3f3b4d)";
                coinEl.style.color = isYang ? "#3a2503" : "#fff";
            }

            let bit = (score === 7 || score === 9) ? "1" : "0";
            historyLines.push({ bit, score });

            const nextCount = historyLines.length;
            btn.innerText = `🪙 동전 던지기 (${nextCount}/6)`;
            
            if (nextCount < 6) {
                btn.disabled = false;
                isSpinning = false;
            } else {
                btn.innerText = "☯️ 전통 척전 연산 완료";
                executeUnifiedEngine('coin');
            }
        }, 500);
    }

    function calculateNumberComponent() {
        const n1 = parseInt(document.getElementById("num1").value);
        const n2 = parseInt(document.getElementById("num2").value);

        if (isNaN(n1) || isNaN(n2) || n1 < 1 || n1 > 99 || n2 < 1 || n2 > 99) {
            alert("北辰書院 안내: 1부터 99 사이의 숫자를 양쪽에 정직하게 주입해 주십시오.");
            return;
        }
        executeUnifiedEngine('number', n1, n2);
    }

    function executeUnifiedEngine(type, n1, n2) {
        let upIdx, lowIdx, movingDongRem;

        if (type === 'coin') {
            let lowBitStr = historyLines[0].bit + historyLines[1].bit + historyLines[2].bit;
            let upBitStr = historyLines[3].bit + historyLines[4].bit + historyLines[5].bit;

            function getGuaIdByBit(bitStr) {
                for (let k in trigramOrderMap) { if (trigramOrderMap[k].key === bitStr) return trigramOrderMap[k].id; }
                return 1;
            }
            upIdx = getGuaIdByBit(upBitStr);
            lowIdx = getGuaIdByBit(lowBitStr);

            let totalScore = historyLines.reduce((acc, cur) => acc + cur.score, 0);
            movingDongRem = totalScore % 6; if (movingDongRem === 0) movingDongRem = 6;
        } else {
            upIdx = n1 % 8; if (upIdx === 0) upIdx = 8;
            lowIdx = n2 % 8; if (lowIdx === 0) lowIdx = 8;
            movingDongRem = (n1 + n2) % 6; if (movingDongRem === 0) movingDongRem = 6;
        }

        const upGuaObj = trigramOrderMap[upIdx];
        const lowGuaObj = trigramOrderMap[lowIdx];
        let mainFullKey = lowGuaObj.key + upGuaObj.key; 

        let changeFullKeyArr = mainFullKey.split("");
        let dongTargetIdx = movingDongRem - 1; 
        changeFullKeyArr[dongTargetIdx] = changeFullKeyArr[dongTargetIdx] === "1" ? "0" : "1";
        let changeFullKey = changeFullKeyArr.join("");

        let changeLowerKey = changeFullKey.substring(0, 3);
        let changeUpperKey = changeFullKey.substring(3, 6);

        function findGuaByBit(bitStr) {
            for (let k in trigramOrderMap) { if (trigramOrderMap[k].key === bitStr) return trigramOrderMap[k]; }
            return null;
        }

        const changeLowGuaObj = findGuaByBit(changeLowerKey);
        const changeUpGuaObj = findGuaByBit(changeUpperKey);

        renderUnifiedOutput(upGuaObj, lowGuaObj, changeUpGuaObj, changeLowGuaObj, movingDongRem, type, n1, n2);
        isSpinning = false;
    }

    function renderUnifiedOutput(upGua, lowGua, chgUpGua, chgLowGua, dong효, type, n1, n2) {
        // 🛠️ [버그 척결 수술 완료] 이제 대자연의 공식 규격에 맞춰 완벽하게 "하괘ID-상괘ID" 조합으로 키를 도출합니다.
        const mainKey = lowGua.id + "-" + upGua.id;
        const mainGuaData = name64DB[mainKey] || [64, "화수미제(火水未濟)", "火水未濟"];

        const changeKey = chgLowGua.id + "-" + chgUpGua.id;
        const changeGuaData = name64DB[changeKey] || [64, "화수미제(火水未濟)", "火水未濟"];

        let korDongName = hyoNameList[dong효];

        document.getElementById("mainTitle").innerHTML = `
            <span class="kor">${mainGuaData[0]}. ${mainGuaData[1]}</span> <span style="font-size:14px; color:var(--muted)">(${mainGuaData[2]})</span> 
            <span style="font-size:12px; color:var(--purple); margin-left:6px; font-weight:bold;">✦ ${korDongName} 동(動)</span>
            <span class="nature">상괘:${upGua.element} · 하괘:${lowGua.element}</span>
        `;
        document.getElementById("mainShape").innerHTML = generateFullGuaLinesHTML(lowGua.key + upGua.key, dong효);
        
        const mainReading = getBukjinReading(mainGuaData[0], mainGuaData[1]);
        const changeReading = getBukjinReading(changeGuaData[0], changeGuaData[1]);
        let mainDescStr = `• <strong>시공간 원소 조합:</strong> 외부 기류는 [${upGua.name} - ${upGua.action} ${upGua.nature}] 이며, 내부 기반은 [${lowGua.name} - ${lowGua.action} ${lowGua.nature}]의 기운입니다.`;
        mainDescStr += renderKeywords(mainReading.keywords);
        mainDescStr += `<span class="bukjin-heading">📜 북진서원 현재 흐름</span>${mainReading.current}`;
        mainDescStr += `<span class="bukjin-heading">🧭 북진 행동지침</span>${renderActions(mainReading.actions)}`;
        mainDescStr += `<div class="north-summary">${mainReading.oneLine}</div>`;
        document.getElementById("mainDesc").innerHTML = mainDescStr;

        document.getElementById("changeTitle").innerHTML = `
            <span class="kor" style="color:var(--purple)">지괘: ${changeGuaData[0]}. ${changeGuaData[1]}</span> <span style="font-size:14px; color:var(--muted)">(${changeGuaData[2]})</span>
            <span class="nature">상괘:${chgUpGua.element} · 하괘:${chgLowGua.element}</span>
        `;
        document.getElementById("changeShape").innerHTML = generateFullGuaLinesHTML(chgLowGua.key + chgUpGua.key, null);

        let dynamicHyoAdvice = `현재 마주하신 상황의 결정적 변곡점은 아래서부터 위로 세어 올렸을 때 <strong>[제 ${korDongName}]</strong>의 자리에 머물러 있습니다. 이 한 줄의 기류가 거꾸로 뒤집히며 주도권이 교차하는 하루이니, 섣부른 감정적 도약을 멈추고 내면의 시스템과 바운더리를 꼼꼼하게 다잡는 자중의 미덕을 기할 때 허물이 사라지고 대길할 것입니다.`;
        
        if (mainGuaData[0] === 26 && dong효 === 4) dynamicHyoAdvice = "어린 소에게 나무틀을 씌우듯 리스크가 밖으로 터져 나오기 전에 미연에 완벽히 차단하고 통제해 내니 크게 길합니다.";
        if (mainGuaData[0] === 37 && dong효 === 2) dynamicHyoAdvice = "내면의 일에 순종하며 음식을 정갈히 단속하듯, 바깥의 무리한 확장 대신 내 바운더리의 기본 고정 루틴을 우직하게 단속하면 큰 허물이 없고 마침내 대통합니다.";

        document.getElementById("changeDesc").innerHTML = `🔮 <strong>동효에 따른 북진의 핀포인트 지침 (효사 조언):</strong>\n<span style="color:var(--purple); font-weight:bold;">[제 ${korDongName} 변동 결과]</span>\n${dynamicHyoAdvice}\n\n💡 <strong>변괘 최종 지향점:</strong> 기운이 변전하여 결론적으로 상괘 <strong>[${chgUpGua.name}]</strong>와 하괘 <strong>[${chgLowGua.name}]</strong>의 환경 조합 구조로 귀착됩니다.${renderKeywords(changeReading.keywords)}<span class="bukjin-heading">변괘 흐름</span>${changeReading.current}<div class="north-summary">${changeReading.oneLine}</div>`;

        let oneLineSummary = `[${mainGuaData[1]}]의 ${korDongName} 변화는 [${changeGuaData[1]}]로 향합니다. ${mainReading.oneLine} 그리고 최종 흐름은 “${changeReading.oneLine}” 입니다.`;
        document.getElementById("bukjinOneLine").innerHTML = `<strong>北辰一言</strong> ${oneLineSummary}`;

        let logText = "";
        if(type === 'coin') {
            logText = `• <strong>척전법 연산 로그:</strong> 동전 3개 6회 투척 ➔ 하괘[${lowGua.name}], 상괘[${upGua.name}] 결합 성립 ➔ 총점수 기반 6 대비 나머지 연산으로 <strong>[${korDongName}]</strong> 변동작동 성립.`;
        } else {
            logText = `• <strong>매화역수 연산 로그:</strong> 주입 영동수 [ 상:${n1} / 하:${n2} ] ➔ 상괘수 % 8 = [${n1%8||8}(${upGua.name})], 하괘수 % 8 = [${n2%8||8}(${lowGua.name})] ➔ 동효 공식: (${n1}+${n2}) % 6 = [<strong>${dong효}효 : ${korDongName}</strong>] 변동작동 성립.`;
        }
        document.getElementById("formulaLog").innerHTML = logText;

        document.getElementById("resultSection").style.display = "block";
    }

    function generateFullGuaLinesHTML(fullKey, dongRow) {
        let html = "";
        for (let i = 5; i >= 0; i--) {
            const isYang = fullKey[i] === "1";
            let inner = isYang ? "" : "<div></div><div></div>";
            let dongClass = (dongRow && (i + 1) === dongRow) ? "dong-target" : "";
            html += `<div class="iching-line ${isYang ? 'yang' : 'yin'} ${dongClass}">${inner}</div>`;
        }
        return html;
    }
</script>
